
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EDE3F7">
<title>20/10</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #51415F;
  --lavender: #B69AD8;
  --cream: #FBF7FF;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: 'Be Vietnam Pro', sans-serif;
  color: var(--ink);
  overflow-x: hidden;
}

button { font: inherit; cursor: pointer; }

.hidden { display: none !important; }

/* =========================
   TRANG CHỌN NGƯỜI NHẬN
========================= */

#home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 18px;
  background:
    radial-gradient(ellipse at 50% 0%, #fff 0%, #f6edfc 38%, transparent 72%),
    linear-gradient(180deg, #ede3f7, #f9e9ed 65%, #f8e8c8);
  position: relative;
  overflow: hidden;
}

.home-glow {
  position: absolute;
  width: 350px;
  height: 350px;
  top: -160px;
  left: 50%;
  transform: translateX(-50%);
  background: #fff8e8;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .8;
}

.home-content {
  width: min(100%, 720px);
  position: relative;
  z-index: 2;
  text-align: center;
  animation: appear 1s ease both;
}

.eyebrow {
  color: #9475B6;
  font-size: 10px;
  letter-spacing: .28em;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.home-title {
  font: 500 clamp(42px, 8vw, 72px)/1.08 'Cormorant Garamond', serif;
  margin: 0 0 20px;
  color: #59466A;
}

.home-title em {
  color: #A080BC;
}

.home-description {
  max-width: 450px;
  margin: 0 auto;
  color: #897b91;
  font-size: 13px;
  line-height: 2;
}

.options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin-top: 42px;
  text-align: center;
}

.option {
  padding: 28px 22px;
  border: 1px solid #ffffffc9;
  border-radius: 8px;
  background: #ffffff85;
  box-shadow: 0 15px 45px #69507812;
  backdrop-filter: blur(12px);
  transition: transform .3s, box-shadow .3s;
}

.option:hover {
  transform: translateY(-5px);
  box-shadow: 0 18px 45px #69507822;
}

.option-icon {
  display: block;
  font-size: 40px;
  margin-bottom: 12px;
  animation: bob 3s ease-in-out infinite alternate;
}

.option h2 {
  font: 600 30px 'Cormorant Garamond', serif;
  margin: 0 0 8px;
}

.option p {
  font-size: 12px;
  line-height: 1.9;
  color: #8d7e91;
  min-height: 46px;
}

.option button {
  width: 100%;
  border: 1px solid #b69ad866;
  background: #b69ad81c;
  color: #705788;
  border-radius: 4px;
  padding: 12px 8px;
  font-size: 11px;
  transition: .25s;
}

.option button:hover {
  background: #b69ad844;
}

.option.sister button {
  background: #f5d56e44;
  border-color: #d3a64288;
  color: #795821;
}

.option.sister button:hover {
  background: #f5d56e88;
}

.home-footer {
  margin-top: 35px;
  font: italic 17px 'Cormorant Garamond', serif;
  color: #9b8aa0;
}

/* =========================
   KHUNG CẢNH CHUNG
========================= */

#garden {
  min-height: 100vh;
  min-height: 100svh;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  animation: appear .8s ease both;
}

#garden.lavender-scene {
  background: linear-gradient(
    180deg,
    #EDE3F7 0%,
    #E5D6F0 45%,
    #D5C5E4 100%
  );
}

#garden.sunflower-scene {
  background: linear-gradient(
    180deg,
    #D9E8C5 0%,
    #F8EBC1 40%,
    #F8D77C 75%,
    #D7B451 100%
  );
}

.scene-glow {
  position: absolute;
  width: 460px;
  height: 460px;
  top: -240px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #FFF8E8;
  opacity: .55;
  filter: blur(65px);
  pointer-events: none;
  z-index: -2;
}

#garden.sunflower-scene .scene-glow {
  background: #FFF8C8;
  opacity: .8;
}

/* Đồi của cảnh oải hương */

.valley {
  position: absolute;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
}

.hill {
  position: absolute;
  width: 150%;
  left: -25%;
  border-radius: 50% 50% 0 0;
}

.hill-back {
  height: 42vh;
  min-height: 220px;
  bottom: 7vh;
  background: linear-gradient(180deg, #C8B0D8, #B39BCB);
  transform: rotate(-5deg);
}

.hill-middle {
  height: 34vh;
  min-height: 190px;
  bottom: -3vh;
  left: -35%;
  width: 170%;
  background: linear-gradient(180deg, #A78BB9, #8E789D);
  transform: rotate(5deg);
}

.hill-front {
  height: 28vh;
  min-height: 160px;
  bottom: -13vh;
  left: -20%;
  width: 145%;
  background: linear-gradient(180deg, #8D7898, #6E647E);
  transform: rotate(-4deg);
}

.mist {
  position: absolute;
  width: 130%;
  height: 100px;
  left: -15%;
  bottom: 19%;
  background: #F8F1FF;
  opacity: .2;
  filter: blur(40px);
  border-radius: 50%;
  animation: mist-drift 16s ease-in-out infinite alternate;
}

/* Đồi của cảnh hướng dương */

.sunflower-hills {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -2;
}

.sunflower-hill {
  position: absolute;
  bottom: 8%;
  width: 120%;
  height: 24%;
  border-radius: 50% 50% 0 0;
}

.sunflower-hill.one {
  left: -35%;
  background: #C8D29A;
  transform: rotate(-5deg);
}

.sunflower-hill.two {
  right: -45%;
  bottom: 5%;
  background: #A8BB78;
  transform: rotate(6deg);
}

/* =========================
   HOA OẢI HƯƠNG
   Dựa trên ban-06.html
========================= */

.flower-field {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.lavender {
  position: absolute;
  bottom: 0;
  width: var(--size, 50px);
  height: var(--height, 180px);
  transform-origin: center bottom;
  animation: flower-sway var(--sway, 4s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}

.lavender .stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 2px;
  height: 72%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: linear-gradient(180deg, #73865F, #536D52);
}

.lavender .leaf {
  position: absolute;
  width: 17px;
  height: 6px;
  background: #748966;
  border-radius: 100% 0 100% 0;
}

.lavender .leaf-left {
  left: -14px;
  bottom: 28%;
  transform: rotate(22deg);
}

.lavender .leaf-right {
  right: -14px;
  bottom: 42%;
  transform: rotate(75deg) scaleX(-1);
}

.lavender .blossom {
  position: absolute;
  left: 50%;
  top: 3%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transform: translateX(-50%);
}

.lavender .petal-row {
  display: flex;
  justify-content: center;
  gap: 1px;
}

.lavender .petal {
  width: 8px;
  height: 12px;
  border-radius: 70% 70% 45% 45%;
  background: linear-gradient(180deg, #C8A6EA, #8D69B5);
  box-shadow: 0 1px 4px #73518D25;
}

.lavender .petal:nth-child(2n) {
  background: linear-gradient(180deg, #D8BDF2, #A485C8);
}

.lavender .petal-row:nth-child(2) .petal {
  width: 7px;
  height: 11px;
}

.lavender .petal-row:nth-child(3) .petal {
  width: 6px;
  height: 9px;
}

/* =========================
   HOA HƯỚNG DƯƠNG
   Dựa trên ban-07.html
========================= */

.sunflower-field {
  position: absolute;
  inset: auto 0 0;
  height: 44%;
  overflow: hidden;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    transparent,
    #C3A34722 30%,
    #B3A04C66 100%
  );
}

.sunflower {
  position: absolute;
  bottom: -4px;
  width: var(--size);
  height: calc(var(--size) * 2.6);
  transform: rotate(var(--tilt));
  transform-origin: bottom center;
  animation: sunflower-sway var(--sway, 4s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}

.sunflower .stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 5px;
  height: 70%;
  transform: translateX(-50%);
  border-radius: 5px;
  background: linear-gradient(90deg, #526E35, #78974A);
}

.sunflower .leaf {
  position: absolute;
  width: 26px;
  height: 12px;
  background: #6C8C45;
  border-radius: 100% 0 100% 0;
}

.sunflower .leaf.left {
  left: 2px;
  bottom: 38%;
  transform: rotate(15deg);
}

.sunflower .leaf.right {
  right: 0;
  bottom: 52%;
  transform: scaleX(-1) rotate(15deg);
}

.sunflower .flower-head {
  position: absolute;
  top: 0;
  left: 50%;
  width: var(--head);
  height: var(--head);
  transform: translateX(-50%);
}

.sunflower .petals {
  position: absolute;
  inset: 0;
  animation: flower-turn 35s linear infinite;
}

.sunflower .petal {
  position: absolute;
  width: 29%;
  height: 48%;
  left: 35.5%;
  top: 1%;
  transform-origin: 50% 102%;
  border-radius: 55% 55% 42% 42%;
  background: linear-gradient(180deg, #FFE879, #F7C735 65%, #E6A51C);
  box-shadow: inset 0 0 2px #FFF6B5;
}

.sunflower .flower-center {
  position: absolute;
  width: 47%;
  height: 47%;
  top: 26.5%;
  left: 26.5%;
  border-radius: 50%;
  background:
    radial-gradient(circle, #4C2D16 1px, transparent 1.5px),
    radial-gradient(circle, #885024, #513017 75%);
  background-size: 5px 5px, 100% 100%;
  border: 2px solid #A36A2C;
  box-shadow: 0 0 5px #7B4A2433;
}

/* =========================
   ĐOM ĐÓM VÀ CÁNH HOA BAY
========================= */

.fireflies, .floating-petals {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.firefly {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #FFF7D8;
  box-shadow: 0 0 8px 2px #FFF5D855, 0 0 16px #FFF7E455;
  animation: firefly-float var(--duration, 5s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}

.floating-petal {
  position: absolute;
  bottom: -30px;
  width: var(--size);
  height: calc(var(--size) * 1.5);
  border-radius: 70% 30% 65% 35%;
  background: linear-gradient(135deg, #FFF1A1, #F6C844 70%, #E5A92B);
  opacity: 0;
  animation: float-up var(--duration) linear forwards;
}

/* =========================
   LỜI CHÚC
========================= */

.scene-content {
  position: relative;
  z-index: 3;
  width: min(560px, calc(100% - 36px));
  margin: 0 auto;
  padding: 35px 0 220px;
  text-align: center;
}

.back {
  position: absolute;
  top: 16px;
  left: 0;
  border: 1px solid #ffffff88;
  background: #ffffff35;
  color: #65546F;
  padding: 10px 13px;
  border-radius: 4px;
  font-size: 11px;
  backdrop-filter: blur(8px);
}

.sunflower-scene .back {
  color: #6C542A;
}

.message {
  margin-top: 38px;
  padding: 28px 25px;
  border: 1px solid #ffffffaa;
  border-radius: 5px;
  background: #FFFCF2D9;
  box-shadow: 0 18px 55px #55426920;
  backdrop-filter: blur(10px);
  animation: card-glow 5s ease-in-out infinite alternate;
}

.sunflower-scene .message {
  background: #FFFCF2E8;
  border-color: #D9B96699;
}

.message-icon {
  font-size: 28px;
  margin-bottom: 7px;
}

.message h1 {
  font: 600 clamp(38px, 7vw, 56px)/1.05 'Cormorant Garamond', serif;
  margin: 0 0 18px;
  color: #59466A;
}

.sunflower-scene .message h1 {
  color: #77531F;
}

.message h1 em {
  color: #9475B6;
}

.sunflower-scene .message h1 em {
  color: #BD8B29;
}

.message .divider {
  color: #B293D0;
  margin: 15px 0;
}

.sunflower-scene .message .divider {
  color: #D5A62F;
}

.divider::before, .divider::after {
  content: '';
  display: inline-block;
  vertical-align: middle;
  width: 42px;
  height: 1px;
  background: #B69AD855;
  margin: 0 12px;
}

.message p {
  font: 500 21px/1.75 'Cormorant Garamond', serif;
  color: #756581;
  margin: 0;
}

.sunflower-scene .message p {
  color: #826C43;
}

.signature {
  margin-top: 23px;
  text-align: right;
  font: italic 24px 'Cormorant Garamond', serif;
  color: #9475B6;
}

.sunflower-scene .signature {
  color: #BD8B29;
}

.scene-footer {
  margin-top: 18px;
  color: #fffdf5;
  font-size: 10px;
  letter-spacing: .2em;
  text-shadow: 0 1px 8px #4c3c55;
}

/* =========================
   ANIMATION
========================= */

@keyframes flower-sway {
  from { transform: rotate(-5deg); }
  to { transform: rotate(5deg); }
}

@keyframes sunflower-sway {
  from { rotate: -3deg; }
  to { rotate: 3deg; }
}

@keyframes flower-turn {
  to { rotate: 360deg; }
}

@keyframes mist-drift {
  from { transform: translateX(-4%); }
  to { transform: translateX(4%); }
}

@keyframes firefly-float {
  0% { opacity: .15; transform: translate(0, 0) scale(.7); }
  50% { opacity: .8; }
  100% { opacity: .4; transform: translate(12px, -20px) scale(1.2); }
}

@keyframes float-up {
  0% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.7); }
  12% { opacity: .9; }
  70% { opacity: .8; }
  100% {
    opacity: 0;
    transform: translate(var(--drift), -110vh) rotate(var(--rotation)) scale(1.1);
  }
}

@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes bob {
  from { transform: translateY(0) rotate(-4deg); }
  to { transform: translateY(-6px) rotate(4deg); }
}

@keyframes card-glow {
  from { box-shadow: 0 18px 55px #55426920, 0 0 18px #C7A8E510; }
  to { box-shadow: 0 18px 55px #55426925, 0 0 38px #B69AD844; }
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 520px) {
  .options {
    grid-template-columns: 1fr;
    gap: 13px;
    margin-top: 28px;
    width: min(100%, 350px);
  }

  .option {
    padding: 18px 18px;
  }

  .option-icon {
    font-size: 32px;
    margin-bottom: 4px;
  }

  .option h2 {
    font-size: 25px;
  }

  .option p {
    min-height: 0;
    margin: 7px 0 12px;
  }

  .option button {
    max-width: 240px;
  }

  .home-footer {
    margin-top: 22px;
  }

  .scene-content {
    padding-top: 30px;
    padding-bottom: 180px;
  }

  .message {
    margin-top: 45px;
    padding: 25px 18px;
  }

  .message p {
    font-size: 19px;
  }

  .hill-back { height: 35vh; }
  .hill-middle { height: 28vh; }
  .hill-front { height: 23vh; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<!-- TRANG CHỌN -->
<section id="home">
  <div class="home-glow"></div>

  <main class="home-content">
  

    <h1 class="home-title">
      chúc mừng<br>
      <em>20/10</em>
    </h1>

   

    <div class="options">
      <article class="option">
        <span class="option-icon">💜</span>
        <h2>Dành cho mẹ</h2>
       
        <button onclick="openGarden('mom')">
          Mở khu vườn dành cho mẹ 
        </button>
      </article>

      <article class="option sister">
        <span class="option-icon">🌻</span>
        <h2>Dành cho Miu</h2>
    
        <button onclick="openGarden('sis')">
          Mở khu vườn dành cho Miu
        </button>
      </article>
    </div>


  </main>
</section>

<!-- KHUNG CẢNH -->
<section id="garden" class="hidden">
  <div class="scene-glow"></div>

  <div class="valley" id="valley">
    <div class="hill hill-back"></div>
    <div class="hill hill-middle"></div>
    <div class="hill hill-front"></div>
    <div class="mist"></div>
  </div>

  <div class="sunflower-hills hidden" id="sunflower-hills">
    <div class="sunflower-hill one"></div>
    <div class="sunflower-hill two"></div>
  </div>

  <div class="flower-field" id="flower-field"></div>
  <div class="sunflower-field hidden" id="sunflower-field"></div>
  <div class="fireflies" id="fireflies"></div>
  <div class="floating-petals" id="floating-petals"></div>

  <main class="scene-content">
    <button class="back" onclick="goHome()">← Quay lại</button>

    <article class="message">
      <div class="message-icon" id="message-icon">❀</div>
      <h1 id="message-title">Gửi <em>mẹ</em></h1>
      <div class="divider">♡</div>
      <p id="message-text"></p>
      <div class="signature" id="signature"></div>
    </article>

    <div class="scene-footer" id="scene-footer">
   
    </div>
  </main>
</section>

<script>
const $ = id => document.getElementById(id);

const home = $('home');
const garden = $('garden');

const messages = {
  mom: {
    scene: 'lavender-scene',
    title: 'Gửi mẹ',
    icon: '❀',
    text: 'Con mong mẹ luôn mạnh khỏe, bình an và có thật nhiều niềm vui. Mong những vất vả của mẹ sẽ vơi đi, những ngày mệt mỏi sẽ có người sẻ chia. Con mong mẹ luôn tìm thấy bình yên trong những điều nhỏ bé nhất, giống như thung lũng hoa này luôn dịu dàng chờ mẹ ghé thăm.',
    footer: 'A LITTLE GARDEN FOR MOM'
  },
  sis: {
    scene: 'sunflower-scene',
    title: 'Gửi em',
    icon: '✿',
    text: 'Anh 2 chúc Miu luôn tự tin, học giỏi, ngày càng ít hét hơn',
    
    footer: 'A LITTLE FIELD OF SUNSHINE'
  }
};

const reduceMotion = window.matchMedia(
  '(prefers-reduced-motion: reduce)'
).matches;

/* TẠO HOA OẢI HƯƠNG */
function createLavender(x, size, height, delay, sway) {
  const flower = document.createElement('div');
  flower.className = 'lavender';

  flower.style.left = x + '%';
  flower.style.setProperty('--size', size + 'px');
  flower.style.setProperty('--height', height + 'px');
  flower.style.setProperty('--delay', delay + 's');
  flower.style.setProperty('--sway', sway + 's');

  const stem = document.createElement('div');
  stem.className = 'stem';

  const leafLeft = document.createElement('div');
  leafLeft.className = 'leaf leaf-left';

  const leafRight = document.createElement('div');
  leafRight.className = 'leaf leaf-right';

  stem.append(leafLeft, leafRight);

  const blossom = document.createElement('div');
  blossom.className = 'blossom';

  [3, 3, 2, 2, 1].forEach(count => {
    const row = document.createElement('div');
    row.className = 'petal-row';

    for (let i = 0; i < count; i++) {
      const petal = document.createElement('span');
      petal.className = 'petal';
      row.appendChild(petal);
    }

    blossom.appendChild(row);
  });

  flower.append(stem, blossom);
  $('flower-field').appendChild(flower);
}

/* Ba lớp hoa tạo chiều sâu như ban-06 */
function createLavenderField() {
  const field = $('flower-field');
  field.replaceChildren();

  const width = window.innerWidth;

  const rows = [
    {
      count: Math.ceil(width / 48),
      size: [28, 38],
      height: [70, 105]
    },
    {
      count: Math.ceil(width / 38),
      size: [36, 50],
      height: [110, 165]
    },
    {
      count: Math.ceil(width / 65),
      size: [48, 66],
      height: [155, 220]
    }
  ];

  rows.forEach(row => {
    for (let i = 0; i < row.count; i++) {
      createLavender(
        (i / row.count) * 100,
        row.size[0] + Math.random() * (row.size[1] - row.size[0]),
        row.height[0] + Math.random() * (row.height[1] - row.height[0]),
        Math.random() * -5,
        3 + Math.random() * 3
      );
    }
  });
}

/* TẠO HOA HƯỚNG DƯƠNG */
function createSunflower(x, size, tilt, delay) {
  const flower = document.createElement('div');
  flower.className = 'sunflower';

  flower.style.left = x + '%';
  flower.style.setProperty('--size', size + 'px');
  flower.style.setProperty('--head', size * 1.2 + 'px');
  flower.style.setProperty('--tilt', tilt + 'deg');
  flower.style.setProperty('--sway', (3 + Math.random() * 3) + 's');
  flower.style.setProperty('--delay', delay + 's');

  const stem = document.createElement('div');
  stem.className = 'stem';

  const left = document.createElement('div');
  left.className = 'leaf left';

  const right = document.createElement('div');
  right.className = 'leaf right';

  stem.append(left, right);

  const head = document.createElement('div');
  head.className = 'flower-head';

  const petals = document.createElement('div');
  petals.className = 'petals';

  for (let i = 0; i < 12; i++) {
    const petal = document.createElement('span');
    petal.className = 'petal';
    petal.style.transform = `rotate(${i * 30}deg)`;
    petals.appendChild(petal);
  }

  const center = document.createElement('div');
  center.className = 'flower-center';

  head.append(petals, center);
  flower.append(stem, head);
  $('sunflower-field').appendChild(flower);
}

function createSunflowerField() {
  const field = $('sunflower-field');
  field.replaceChildren();

  const count = window.innerWidth < 480 ? 17 : 29;

  for (let i = 0; i < count; i++) {
    createSunflower(
      (i / (count - 1)) * 108 - 4,
      23 + Math.random() * 25,
      -8 + Math.random() * 16,
      Math.random() * -4
    );
  }
}

/* ĐOM ĐÓM */
function createFireflies() {
  const container = $('fireflies');
  container.replaceChildren();

  for (let i = 0; i < 35; i++) {
    const dot = document.createElement('span');
    dot.className = 'firefly';

    dot.style.left = Math.random() * 100 + '%';
    dot.style.top = (25 + Math.random() * 70) + '%';
    dot.style.setProperty('--duration', (3 + Math.random() * 5) + 's');
    dot.style.setProperty('--delay', (-Math.random() * 5) + 's');

    container.appendChild(dot);
  }
}

/* CÁNH HOA HƯỚNG DƯƠNG BAY */
function createFloatingPetal() {
  if (document.hidden || reduceMotion ||
      garden.classList.contains('hidden') ||
      !garden.classList.contains('sunflower-scene')) return;

  const container = $('floating-petals');
  const petal = document.createElement('span');
  petal.className = 'floating-petal';

  petal.style.left = Math.random() * 100 + '%';
  petal.style.setProperty('--size', (7 + Math.random() * 9) + 'px');
  petal.style.setProperty('--duration', (9 + Math.random() * 9) + 's');
  petal.style.setProperty('--drift', (-100 + Math.random() * 200) + 'px');
  petal.style.setProperty('--rotation', (180 + Math.random() * 540) + 'deg');

  container.appendChild(petal);
  petal.addEventListener('animationend', () => petal.remove(), { once: true });
}

/* CHUYỂN CẢNH */
function openGarden(person) {
  const data = messages[person];

  home.classList.add('hidden');
  garden.classList.remove('hidden');

  garden.classList.remove('lavender-scene', 'sunflower-scene');
  garden.classList.add(data.scene);

  const isMom = person === 'mom';

  $('valley').classList.toggle('hidden', !isMom);
  $('sunflower-hills').classList.toggle('hidden', isMom);
  $('flower-field').classList.toggle('hidden', !isMom);
  $('sunflower-field').classList.toggle('hidden', isMom);
  $('floating-petals').replaceChildren();

  $('message-title').innerHTML = isMom
    ? 'Gửi <em>mẹ</em>'
    : 'Gửi <em>em</em>';

  $('message-icon').textContent = data.icon;
  $('message-text').textContent = data.text;
  $('signature').textContent = data.signature;
  $('scene-footer').textContent = data.footer;

  if (isMom) {
    createLavenderField();
  } else {
    createSunflowerField();
  }

  createFireflies();

  window.scrollTo(0, 0);
}

function goHome() {
  garden.classList.add('hidden');
  home.classList.remove('hidden');
  $('floating-petals').replaceChildren();
  window.scrollTo(0, 0);
}

/* Chỉ vẽ lại cánh đồng khi đổi kích thước màn hình */
let resizeTimer;

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {
    if (garden.classList.contains('hidden')) return;

    if (garden.classList.contains('lavender-scene')) {
      createLavenderField();
    } else {
      createSunflowerField();
    }
  }, 200);
});

/* Tạo cánh hoa bay theo chu kỳ */
if (!reduceMotion) {
  setInterval(createFloatingPetal, 850);
}
</script>
